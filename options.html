<!DOCTYPE html>
<html>
  <head>
    <title>HideIt Settings</title>
    <style>
      :root {
        --bg: #121212;
        --card: #1e1e1e;
        --primary: #bb86fc;
        --error: #cf6679;
        --text: #e0e0e0;
        --text-dim: #a0a0a0;
      }

      body {
        width: 380px;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
      }

      h2 {
        margin: 0 0 20px 0;
        font-weight: 500;
        color: var(--primary);
        letter-spacing: 1px;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .input-card {
        background: var(--card);
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      }

      input[type="text"] {
        width: 100%;
        background: #2d2d2d;
        border: 1px solid #444;
        border-radius: 8px;
        padding: 10px;
        color: white;
        box-sizing: border-box;
        margin-bottom: 12px;
        transition: border-color 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        outline: none;
      }

      .options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text-dim);
        cursor: pointer;
      }

      button#add {
        width: 100%;
        background: var(--primary);
        color: #000;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      button#add:hover {
        opacity: 0.9;
      }

      #list {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .entry {
        background: var(--card);
        padding: 15px;
        border-radius: 10px;
        position: relative;
        border-left: 4px solid var(--primary);
      }

      .entry strong {
        display: block;
        font-size: 12px;
        color: var(--primary);
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .entry-term {
        font-size: 16px;
        margin-bottom: 8px;
        display: block;
        word-break: break-all;
      }

      .entry-meta {
        font-size: 11px;
        color: var(--text-dim);
      }

      .remove {
        position: absolute;
        top: 15px;
        right: 15px;
        background: transparent;
        color: var(--error);
        border: 1px solid var(--error);
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 11px;
        cursor: pointer;
      }

      .remove:hover {
        background: var(--error);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h2>HideIt Settings</h2>

    <div class="container">
      <div class="input-card">
        <input type="text" id="term" placeholder="Phrases to block..." />
        <input type="text" id="replacement" placeholder="Replacement text" />
        <div class="options-row">
          <label>
            <input type="checkbox" id="caseSensitive" />
            Case Sensitive
          </label>
        </div>
        <button id="add">Add Phrase</button>
      </div>

      <div id="list"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
